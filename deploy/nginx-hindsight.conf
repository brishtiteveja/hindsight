# Hindsight — the YouTube narrative map (API + static dashboard on :8300)
# Paste inside the dev.perspectivity.co server block, ABOVE `location / {`:

    location = /hindsight { return 301 /hindsight/; }
    location /hindsight/ {
        proxy_pass http://127.0.0.1:8300/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;   # grounded chat + contradiction runs are long calls
    }
