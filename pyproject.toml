[project]
name = "hindsight-yt"
version = "0.1.0"
description = "Chat with your YouTube channel's entire caption history — grounded, cited, own-channel-first."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "numpy>=2.4.6",
    "youtube-transcript-api>=0.6",
    "yt-dlp>=2026.7.4",
]

[project.optional-dependencies]
fetch = ["youtube-transcript-api>=0.6"]

[project.scripts]
hindsight = "hindsight.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hindsight"]
